name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test and Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci
          cd ../contracts && npm ci

      - name: Test Contracts
        run: |
          cd contracts
          npx hardhat test

      - name: Test Backend
        run: |
          cd backend
          npm test

      - name: Build Backend
        run: |
          cd backend
          npm run build

      - name: Build Frontend
        env:
          NEXT_PUBLIC_ZEROVAULT_ADDRESS: "0xd99501e8a7CE41fFb1DdEF4ca288B57Cf9966091"
          NEXT_PUBLIC_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"
          NEXT_PUBLIC_CHAIN_ID: "11155111"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
        run: |
          cd frontend
          npm run build
