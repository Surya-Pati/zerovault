name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test and Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: Test Shared
        run: pnpm --filter @zerovault/shared test

      - name: Build Shared
        run: pnpm --filter @zerovault/shared build

      - name: Test Contracts
        run: pnpm --filter contracts test

      - name: Test Backend
        run: pnpm --filter backend test

      - name: Build Backend
        run: pnpm --filter backend build

      - name: Build Frontend
        env:
          NEXT_PUBLIC_ZEROVAULT_ADDRESS: "0x66AfE225958aF56E6fB99995897ED3EF17013185"
          NEXT_PUBLIC_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"
          NEXT_PUBLIC_CHAIN_ID: "11155111"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
        run: pnpm --filter frontend build
